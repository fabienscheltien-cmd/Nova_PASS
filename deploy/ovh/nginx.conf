# /etc/nginx/sites-available/nova-pass  (adresse : novapass.nova-serenity.fr)
# Puis : ln -s ../sites-available/nova-pass /etc/nginx/sites-enabled/
#        certbot --nginx -d novapass.nova-serenity.fr
server {
    listen 80;
    listen [::]:80;
    server_name novapass.nova-serenity.fr;

    client_max_body_size 2m;   # logos des sites envoyés en base64

    # Images de l'application copiées par deploy/ovh/recuperer-medias.sh
    location /__l5e/ {
        root /opt/nova-pass/medias;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # X-Real-IP écrasé par nginx : sert à la limitation de débit du formulaire visiteur
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
