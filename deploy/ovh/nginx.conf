# /etc/nginx/sites-available/nova-pass  (remplacer accueil.votre-domaine.fr)
# Puis : ln -s ../sites-available/nova-pass /etc/nginx/sites-enabled/ && certbot --nginx -d accueil.votre-domaine.fr
server {
    listen 80;
    listen [::]:80;
    server_name accueil.votre-domaine.fr;

    client_max_body_size 2m;   # logos des sites envoyés en base64

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # X-Real-IP écrasé par nginx : sert à la limitation de débit du formulaire visiteur
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
